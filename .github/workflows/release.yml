name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-installer:
    name: Build native installer (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-portable:
    name: Build portable zip (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run portable packaging script
        shell: cmd
        run: scripts\package-portable.bat

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}".TrimStart("v")
          $folder = "SatisfactoryLayoutTool-$version-windows"
          if (-not (Test-Path "dist-portable/$folder")) {
            # The script names the folder using the package.json version, which
            # may not match the tag. Fall back to whatever folder is present.
            $folder = (Get-ChildItem -Directory dist-portable | Select-Object -First 1).Name
          }
          Compress-Archive -Path "dist-portable/$folder" -DestinationPath "dist-portable/$folder.zip"
          Get-ChildItem dist-portable

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist-portable/*.zip

  publish-release:
    name: Publish GitHub release
    needs: [build-installer, build-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-files/installer

      - name: Download portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: ./release-files/portable

      - name: List files
        run: find ./release-files -type f

      - name: Create latest.json for auto-updater
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"

          EXE_FILE=$(find ./release-files/installer -name "*.exe" ! -name "*.sig" | head -1)
          EXE_NAME=$(basename "$EXE_FILE")
          SIG_FILE="${EXE_FILE}.sig"
          SIGNATURE=$(cat "$SIG_FILE")

          cat > ./release-files/latest.json << EOF
          {
            "version": "${VERSION_NUM}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${EXE_NAME}"
              }
            }
          }
          EOF

          cat ./release-files/latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'rc') }}
          files: |
            ./release-files/installer/**/*.exe
            ./release-files/installer/**/*.msi
            ./release-files/installer/**/*.sig
            ./release-files/portable/*.zip
            ./release-files/latest.json
          body: |
            ## Satisfactory Layout Tool ${{ steps.get_version.outputs.VERSION }}

            ### 🎮 For Users — Just Want to Use It?

            Pick **one** of these:

            **Option A: Installer (recommended)**
            1. Download the `.exe` file (e.g., `Satisfactory_Layout_Tool_*.exe`)
            2. Double-click to install
            3. Launch from Start Menu
            4. If Windows shows "Windows protected your PC", click *More info* → *Run anyway*

            **Option B: Portable zip (no install required)**
            1. Download `SatisfactoryLayoutTool-*-windows.zip`
            2. Extract anywhere (e.g., your Desktop)
            3. Double-click `SatisfactoryLayoutTool.exe` inside the extracted folder
            4. The app opens in your browser — keep the launcher window open while using it

            No account, no key, no internet connection required after install. 🎉

            ### 🛠️ For Developers

            See [README.md](https://github.com/${{ github.repository }}#quick-start) for build instructions.

            ### 📦 What's in this release

            | File | Use case |
            |------|----------|
            | `*.exe` | Windows installer (NSIS) — registers in Start Menu, supports auto-update |
            | `*.msi` | Windows installer (MSI) — for IT-managed deployments |
            | `*-windows.zip` | Portable build — no install, runs in your browser |
            | `latest.json` | Auto-updater manifest — used by installed apps to check for updates |
            | `*.sig` | Cryptographic signatures for the installers |

            ### License
            AGPL-3.0-or-later with attribution-preservation terms.
            See [LICENSE](https://github.com/${{ github.repository }}/blob/main/LICENSE).
