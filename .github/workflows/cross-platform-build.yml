name: Cross-Platform Build and Test

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
        
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Run tests (Web)
      run: npm test
      env:
        TEST_PLATFORM: web
        
    - name: Run tests (Native)
      run: npm test
      env:
        TEST_PLATFORM: ${{ matrix.platform == 'ubuntu-latest' && 'linux' || matrix.platform == 'windows-latest' && 'windows' || 'macos' }}
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: matrix.node-version == '20.x'
      with:
        files: ./coverage/coverage-final.json
        flags: ${{ matrix.platform }}

  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Tauri app (Windows)
      if: matrix.platform == 'windows-latest'
      run: npm run tauri:build:windows
      
    - name: Build Tauri app (macOS)
      if: matrix.platform == 'macos-latest'
      run: npm run tauri:build:macos
      
    - name: Build Tauri app (Linux)
      if: matrix.platform == 'ubuntu-latest'
      run: npm run tauri:build:linux
      
    - name: Sign Windows artifacts
      if: matrix.platform == 'windows-latest'
      env:
        WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      run: |
        echo "Signing Windows artifacts..."
        # Add Windows signing script here
        
    - name: Notarize macOS app
      if: matrix.platform == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Notarizing macOS app..."
        # Add macOS notarization script here
        
    - name: Upload Windows artifacts
      if: matrix.platform == 'windows-latest'
      uses: actions/upload-artifact@v3
      with:
        name: windows-artifacts
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe
          
    - name: Upload macOS artifacts
      if: matrix.platform == 'macos-latest'
      uses: actions/upload-artifact@v3
      with:
        name: macos-artifacts
        path: |
          src-tauri/target/release/bundle/dmg/*.dmg
          src-tauri/target/release/bundle/macos/*.app
          
    - name: Upload Linux artifacts
      if: matrix.platform == 'ubuntu-latest'
      uses: actions/upload-artifact@v3
      with:
        name: linux-artifacts
        path: |
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/rpm/*.rpm
          src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Create checksums
      run: |
        find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec sha256sum {} \; > checksums.txt
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        prerelease: false
        files: |
          windows-artifacts/*
          macos-artifacts/*
          linux-artifacts/*
          checksums.txt
        body: |
          ## What's Changed
          
          <!-- Add release notes here -->
          
          ## Downloads
          
          ### Windows
          - `.msi` - Windows Installer (recommended)
          - `.exe` - NSIS Installer (alternative)
          
          ### macOS
          - `.dmg` - Disk Image (recommended)
          - Supports both Intel and Apple Silicon
          
          ### Linux
          - `.deb` - Debian/Ubuntu package
          - `.rpm` - Fedora/RHEL package
          - `.AppImage` - Universal package (recommended)
          
          ## Checksums
          
          See `checksums.txt` for SHA256 checksums of all release files.
          
          ## System Requirements
          
          - **Windows**: Windows 10 1903+ or Windows 11
          - **macOS**: macOS 12.0+
          - **Linux**: Ubuntu 20.04+, Fedora 34+, or equivalent
          
        generate_release_notes: true